<!doctype html>
<html>
<head>
  <meta property="og:title" content="Example Channel">
</head>
<body>
<section class="tgme_channel_info">
  <div class="tgme_page_photo_image" style="background-image:url('https://cdn.example/avatar.jpg')"></div>
  <div class="tgme_channel_info_header_title">Example Channel</div>
  <div class="tgme_channel_info_description">Public updates and notes</div>
  <div class="tgme_channel_info_counter"><span class="counter_value">12 345</span> subscribers</div>
</section>
<div class="tgme_widget_message" data-post="example/100">
  <a class="tgme_widget_message_photo_wrap" style="background-image: url('https://cdn.example/100.jpg')"></a>
  <div class="tgme_widget_message_text">First post text</div>
  <span class="tgme_widget_message_views">1.2K</span>
  <time datetime="2026-05-05T10:00:00+00:00"></time>
</div>
<div class="tgme_widget_message" data-post="example/99">
  <div class="tgme_widget_message_text">Second post text</div>
  <span class="tgme_widget_message_views">900</span>
  <time datetime="2026-05-04T10:00:00+00:00"></time>
</div>
</body>
</html>
